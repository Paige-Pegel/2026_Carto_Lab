<!DOCTYPE html>
<meta charset="utf-8">

<script src="https://d3js.org/d3.v4.js"></script>
<script src="https://d3js.org/d3-geo.v1.min.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: linear-gradient(to right, #eef2f3, #dfe9f3);
}

.header {
  text-align: center;
  padding: 20px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #2c3e50;
}

.subtitle {
  font-size: 14px;
  color: #555;
  margin-top: 5px;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  padding: 10px;
}

.axis-label {
  font-size: 12px;
  fill: #333;
}

/* ✔ LEGEND STYLE */
.legend {
  font-size: 13px;
  margin-top: 10px;
  padding: 8px;
  background: #f8f8f8;
  border-radius: 8px;
  border: 1px solid #ddd;
}

.legend-color {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 6px;
}

</style>

<div class="header">
  <div class="title">🌍 Global Urban Population Growth Dashboard</div>
  <div class="subtitle">
    Interactive map + time series population trends (1950–2035)
  </div>
</div>

<div class="container">

  <div class="card">
    <svg id="map" width="520" height="420"></svg>
  </div>

  <div class="card">

    <svg id="chart" width="520" height="420"></svg>

    <!-- ✔ LEGEND -->
    <div id="legend" class="legend">
      Hover a city on the map
    </div>

  </div>

</div>

<script>

// ---------------- DATA ----------------
var years = [1950,1960,1970,1980,1990,2000,2010,2015,2020,2030,2035];

d3.csv("https://raw.githubusercontent.com/Paige-Pegel/2026_Carto_Lab/main/CityData_WUP2018_top200.csv", function(data) {

  data.forEach(d => {
    d.lat = +d.Latitude;
    d.lon = +d.Longitude;
  });

  var cities = data.slice(0, 8);

// ---------------- MAP ----------------
var mapSvg = d3.select("#map"),
    w = +mapSvg.attr("width"),
    h = +mapSvg.attr("height");

var projection = d3.geoMercator()
  .scale(95)
  .translate([w/2, h/1.4]);

var path = d3.geoPath().projection(projection);

d3.json("https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson", function(world) {

  mapSvg.selectAll("path")
    .data(world.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", "#e0e0e0")
    .attr("stroke", "#999");

  mapSvg.selectAll("circle")
    .data(cities)
    .enter()
    .append("circle")
    .attr("cx", d => projection([d.lon, d.lat])[0])
    .attr("cy", d => projection([d.lon, d.lat])[1])
    .attr("r", 5)
    .attr("fill", "#3498db")
    .attr("opacity", 0.8)
    .on("mouseover", function(d) {
      updateChart(d);
    });

});

// ---------------- CHART ----------------
var chartSvg = d3.select("#chart"),
    margin = {top: 30, right: 20, bottom: 50, left: 95},
    width = +chartSvg.attr("width") - margin.left - margin.right,
    height = +chartSvg.attr("height") - margin.top - margin.bottom;

var g = chartSvg.append("g")
  .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

var x = d3.scaleLinear().domain([1950,2035]).range([0,width]);
var y = d3.scaleLinear().range([height,0]);

g.append("g")
  .attr("transform","translate(0,"+height+")")
  .call(d3.axisBottom(x));

var format = d3.format(".2s");

g.append("g")
  .attr("class","y-axis")
  .call(d3.axisLeft(y).ticks(5).tickFormat(format));

// axis labels
g.append("text")
  .attr("class","axis-label")
  .attr("x", width/2)
  .attr("y", height + 40)
  .style("text-anchor","middle")
  .text("Year");

g.append("text")
  .attr("class","axis-label")
  .attr("transform","rotate(-90)")
  .attr("x", -height/2)
  .attr("y", -60)
  .style("text-anchor","middle")
  .text("Population");

// color
var color = d3.scaleOrdinal()
  .range(["#e74c3c","#3498db","#2ecc71","#9b59b6","#f39c12"]);

// ✔ LEGEND UPDATE FUNCTION
function updateLegend(city) {
  d3.select("#legend")
    .html(`
      <div>
        <span class="legend-color" style="background:${color(city.CityName)}"></span>
        <strong>${city.CityName}</strong><br>
        ${city.Country}
      </div>
    `);
}

function updateChart(city) {

  updateLegend(city);

  var values = years.map(y => ({
    year: y,
    pop: +city["pop" + y]
  }));

  y.domain([0, d3.max(values, d => d.pop)]);

  g.selectAll(".y-axis").remove();

  var format = d3.format(".2s");

  g.append("g")
    .attr("class","y-axis")
    .call(d3.axisLeft(y).ticks(5).tickFormat(format));

  var line = d3.line()
    .x(d => x(d.year))
    .y(d => y(d.pop));

  var path = g.selectAll(".line").data([values]);

  path.enter()
    .append("path")
    .attr("class","line")
    .merge(path)
    .transition()
    .duration(500)
    .attr("fill","none")
    .attr("stroke","#e74c3c")
    .attr("stroke-width",3)
    .attr("d", line);

}

});
</script>
